[package]
name = "spine-studio"
version = "0.1.0"
edition = "2021"
[lib]
name = "spine_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "fs", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"

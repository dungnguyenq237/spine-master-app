            reader.onerror = () =>
              reject(
                  reader.error || new Error("Could not read text file"),
              );
            reader.readAsText(file);
          });
        }

        function readArrayBuffer(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () =>
              reject(
                  reader.error || new Error("Could not read binary file"),
              );
            reader.readAsArrayBuffer(file);
          });
        }

        function readDataURL(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result ?? ""));
            reader.onerror = () =>
              reject(
                  reader.error || new Error("Could not read image file"),
              );
            reader.readAsDataURL(file);
          });
        }

        function loadImage(src) {
          return new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error("Image load failed"));
            image.src = src;
          });
        }

        function createSceneRenderer(
          sp,
          canvas,
          preserveDrawingBuffer = false,
          alphaBackground = false,
        ) {
          const config = {
            alpha: Boolean(alphaBackground),
            preserveDrawingBuffer: Boolean(preserveDrawingBuffer),
            premultipliedAlpha: false,
          };
          const context = new sp.webgl.ManagedWebGLRenderingContext(
            canvas,
            config,
          );
          const sceneRenderer = new sp.webgl.SceneRenderer(canvas, context);
          return { context, sceneRenderer, gl: context.gl };
        }

        function disposeRenderer(context) {
          try {
            const gl = context?.gl;
            if (!gl) return;
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
          } catch {}
        }

        function setupCamera(sceneRenderer, cx, cy, worldW, worldH) {
          const cam = sceneRenderer.camera;
          cam.position.x = cx;
          cam.position.y = cy;
          cam.up.y = 1;
          cam.direction.z = -1;
          cam.near = 0;
          cam.far = 2;
          cam.viewportWidth = worldW;
          cam.viewportHeight = worldH;
          cam.update();
        }

        function renderSkeleton(
          sceneRenderer,
          gl,
          skeleton,
          canvasW,
          canvasH,
          transparent = false,
          premultipliedAlpha = false,
        ) {
          gl.viewport(0, 0, canvasW, canvasH);
          if (transparent) {
            gl.clearColor(0, 0, 0, 0);
          } else {
            gl.clearColor(0.039, 0.039, 0.078, 1);
          }
          gl.clear(gl.COLOR_BUFFER_BIT);
          sceneRenderer.begin();
          sceneRenderer.drawSkeleton(skeleton, premultipliedAlpha);
          sceneRenderer.end();
        }

        async function loadSpineFiles(entry) {
          const isBinary = Boolean(entry.skelFile);
          const skelPromise = isBinary
            ? readArrayBuffer(entry.skelFile)
            : readText(entry.jsonFile);
          const [skelData, atlasText] = await Promise.all([
            skelPromise,
            readText(entry.atlasFile),
          ]);
          const pngFiles =
            entry.pngFiles && entry.pngFiles.length > 0
              ? entry.pngFiles
              : entry.pngFile
                ? [entry.pngFile]
                : [];
          if (pngFiles.length === 0) {
            throw new Error("No PNG texture files found for this atlas.");
          }

          const imageEntries = await Promise.all(
            pngFiles.map(async (file) => {
              const dataUrl = await readDataURL(file);
              const image = await loadImage(dataUrl);
              return { file, image };
            }),
          );
          const imageMap = new Map();
          for (const item of imageEntries) {
            imageMap.set(item.file.name.toLowerCase(), item.image);
          }
          const imageBundle = {
            defaultImage: imageEntries[0].image,
            imagesByName: imageMap,
          };

          const version =
            (isBinary ? detectVersionFromSkel(skelData) : detectVersionFromJson(skelData)) ||
            detectVersionFromPath(entry.skelFile || entry.jsonFile);
          let runtimeKey = versionToRuntimeKey(version);
          const parsedVersion = parseSpineVersion(version);
          const is43Binary =
            isBinary &&
            parsedVersion &&
            parsedVersion.major === 4 &&
            parsedVersion.minor >= 3;

          if (is43Binary) {
            const runtimeModuleFile = findRuntime43ModuleFile(entry);
            if (runtimeModuleFile) {
              try {
                runtimeKey = CUSTOM_RUNTIME_43_KEY;
                const sp = await loadRuntimeFromModuleFile(runtimeModuleFile, runtimeKey);
                return {
                  skelData,
                  atlasText,
                  imageBundle,
                  sp,
                  isBinary,
                  version,
                  runtimeKey,
                };
              } catch (error) {
                console.warn("Spine 4.3 runtime bridge failed:", error);
              }
            }

            throw new Error(
              `Binary SKEL ${version} needs a 4.3 web runtime. Include spine-webcomponents.min.mjs in the selected folder (or export JSON / re-export SKEL to 4.2).`,
            );
          }

          const isUnsupportedBinaryVersion =
            isBinary &&
            parsedVersion &&
            parsedVersion.major > 4;
          if (isUnsupportedBinaryVersion) {
            throw new Error(
              `Binary SKEL ${version} is newer than supported runtimes. Export JSON (same version) or re-export to a supported SKEL version.`,
            );
          }
          const hasModernAtlasSyntax = /(^|\n)\s*(pma|bounds)\s*:/i.test(
            atlasText,
          );

          // Modern atlas syntax (pma/bounds) is not compatible with 3.x atlas parser.
          // Force a 4.x runtime to avoid legacy parser crashes.
          if (
            isBinary &&
            hasModernAtlasSyntax &&
            ["3_5", "3_6", "3_7", "3_8"].includes(runtimeKey)
          ) {
            runtimeKey = "4_2";
          }

          if (
            isBinary &&
            typeof window.needsSkelDecoding === "function" &&
            window.needsSkelDecoding(skelData)
          ) {
            try {
              const decodedJson = window.decodeSkel34(skelData);
              runtimeKey = "3_5";
              const sp = await loadRuntime(runtimeKey);
              return {
                skelData: decodedJson,
                atlasText,
                imageBundle,
                sp,
                isBinary: false,
                version,
                runtimeKey,
              };
            } catch (error) {
              console.warn("Decode skel 3.4/3.5 failed:", error);
            }
          }

          const sp = await loadRuntime(runtimeKey);
          return {
            skelData,
            atlasText,
            imageBundle,
            sp,
            isBinary,
            version,
            runtimeKey,
          };
        }

        function createSkeletonData(
          skelData,
          atlasText,
          imageBundle,
          glContext,
          sp,
          isBinary,
        ) {
          function normalizeLegacyAtlasText(input) {
            const lines = String(input || "").split(/\r\n|\r|\n/);
            const out = [];
            let i = 0;

            while (i < lines.length) {
              const line = lines[i];
              const trimmed = line.trim();

              if (!trimmed) {
                out.push("");
                i += 1;
                continue;
              }

              const isPageStart =
                !trimmed.includes(":") &&
                (i === 0 || !lines[i - 1].trim());
              if (!isPageStart) {
                out.push(line);
                i += 1;
                continue;
              }

              const pageName = trimmed;
              i += 1;

              const header = Object.create(null);
              while (i < lines.length) {
                const headerLine = lines[i].trim();
                if (!headerLine || !headerLine.includes(":")) break;
                const colon = headerLine.indexOf(":");
                const key = headerLine.slice(0, colon).trim().toLowerCase();
                const value = headerLine.slice(colon + 1).trim();
                header[key] = value;
                i += 1;
              }

              out.push(pageName);
              if (header.size) out.push(`size: ${header.size}`);
              out.push("format: RGBA8888");

              const filterValue = String(header.filter || "").toLowerCase();
              const isBoolFilter =
                filterValue === "true" ||
                filterValue === "false" ||
                filterValue === "true,true" ||
                filterValue === "false,false";
              out.push(
                isBoolFilter || !header.filter
                  ? "filter: Linear,Linear"
                  : `filter: ${header.filter}`,
              );

              let repeatValue = header.repeat;
              if (!repeatValue && header.pma) repeatValue = "none";
              if (/^(true|false)$/i.test(String(repeatValue || ""))) {
                repeatValue = "none";
              }
              out.push(`repeat: ${repeatValue || "none"}`);
            }

            return out.join("\n");
          }

          const textureInstances = [];
          const getImageByAtlasPage = (path) => {
            const key = String(path || "")
              .replace(/^.*[\\/]/, "")
              .trim()
              .toLowerCase();
            const candidates = key ? [key] : [];
            if (key && !/\.[a-z0-9]+$/i.test(key)) candidates.push(`${key}.png`);
            for (const candidate of candidates) {
              const image = imageBundle?.imagesByName?.get?.(candidate);
              if (image) return image;
            }
            return imageBundle?.imagesByName?.values?.().next?.().value || imageBundle?.defaultImage || null;
          };
          const getTextureForPage = (path) => {
            const image = getImageByAtlasPage(path);
            if (!image) return null;
            const texture = new sp.webgl.GLTexture(glContext, image);
            textureInstances.push(texture);
            return texture;
          };
          const bindAtlasPageTextures = () => {
            const pages = atlas?.pages;
            if (!Array.isArray(pages) || pages.length === 0) return;
            for (const page of pages) {
              if (!page || page.texture) continue;
              const pageName = String(page.name || "").trim();
              const image = getImageByAtlasPage(pageName);
              if (!image) {
                throw new Error(
                  `Atlas page image not found: ${pageName || "(unnamed page)"}`,
                );
              }
              const texture = new sp.webgl.GLTexture(glContext, image);
              textureInstances.push(texture);
              if (typeof page.setTexture === "function") {
                page.setTexture(texture);
              } else {
                page.texture = texture;
              }
            }
          };
          let atlas = null;

          try {
            const cleanedAtlas = atlasText.replace(/^\s+/, "");
            try {
              atlas = new sp.TextureAtlas(cleanedAtlas, getTextureForPage);
            } catch (error) {
              const message =
                error instanceof Error ? error.message : String(error || "");
              const canRetry =
                /Unknown texture filter/i.test(message) ||
                /Unknown texture wrap/i.test(message);
              if (!canRetry) throw error;
              atlas = new sp.TextureAtlas(
                normalizeLegacyAtlasText(cleanedAtlas),
                getTextureForPage,
              );
            }
            bindAtlasPageTextures();

            const atlasLoader = new sp.AtlasAttachmentLoader(atlas);
            let skeletonData;
            if (isBinary) {
              const skeletonBinary = new sp.SkeletonBinary(atlasLoader);
              skeletonData = skeletonBinary.readSkeletonData(
                new Uint8Array(skelData),
              );
            } else {
              const skeletonJson = new sp.SkeletonJson(atlasLoader);
              const jsonData =
                typeof skelData === "string" ? JSON.parse(skelData) : skelData;
              skeletonData = skeletonJson.readSkeletonData(jsonData);
            }
            const atlasUsesPma =
              Array.isArray(atlas?.pages) &&
              atlas.pages.some((page) => Boolean(page?.pma));
            const usesPremultipliedAlpha =
              atlasUsesPma || /(^|\n)\s*pma\s*:\s*true\b/i.test(atlasText);

            return {
              skeletonData,
              atlas,
              usesPremultipliedAlpha,
              glTexture: {
                dispose: () => {
                  for (const tex of textureInstances) tex?.dispose?.();
                },
              },
            };
          } catch (error) {
            try {
              atlas?.dispose?.();
            } catch {}
            try {
              for (const tex of textureInstances) tex?.dispose?.();
            } catch {}
            throw error;
          }
        }

        async function createSkeletonDataWithRuntimeFallback(
          skelData,
          atlasText,
          image,
          preferredSp,
          preferredRuntimeKey,
          isBinary,
          version,
        ) {
          const candidateKeys = isBinary
            ? [
                preferredRuntimeKey,
                "4_2",
                "4_1",
                "4_0",
                "3_8",
                "3_7",
                "3_6",
                "3_5",
              ]
            : [preferredRuntimeKey];
          const uniqueKeys = [...new Set(candidateKeys.filter(Boolean))];
          const errors = [];

          for (const key of uniqueKeys) {
            const sp = key === preferredRuntimeKey ? preferredSp : await loadRuntime(key);
            const preview = getPreviewState(sp, key);
            try {
              const created = createSkeletonData(
                skelData,
                atlasText,
                image,
                preview.context,
                sp,
                isBinary,
              );
              return { ...created, sp, runtimeKey: key };
            } catch (error) {
              const message =
                error instanceof Error ? error.message : String(error || "Unknown");
              errors.push(`[${key}] ${message}`);
            }
          }

          throw new Error(
            `No compatible runtime for ${version || "unknown version"} (${isBinary ? "SKEL" : "JSON"}). ${errors.join(" | ")}`,
          );
        }

        function getSkeletonBounds(sp, skeletonData, runtimeKey) {
          const skeleton = new sp.Skeleton(skeletonData);
          resetSkeletonToSetupPose(skeleton);
          applyFallbackSkinForRuntime(sp, skeletonData, skeleton, runtimeKey);
          updateSkeletonWorld(sp, skeleton);

          const offset = new sp.Vector2();
          const size = new sp.Vector2();
          skeleton.getBounds(offset, size, []);

          const valid =
            Number.isFinite(offset.x) &&
            Number.isFinite(offset.y) &&
            Number.isFinite(size.x) &&
            Number.isFinite(size.y) &&
            size.x > 1 &&
            size.y > 1;
          if (valid) {
            const width = size.x;
            const height = size.y;
            return {
              cx: offset.x + width / 2,
              cy: offset.y + height / 2,
              w: width,
              h: height,
            };
          }

          const fallbackW = skeletonData.width || 200;
          const fallbackH = skeletonData.height || 400;
          return { cx: 0, cy: fallbackH / 2, w: fallbackW, h: fallbackH };
        }

        function getPreviewState(sp, runtimeKey) {
          if (previewStates[runtimeKey]) return previewStates[runtimeKey];
          const canvas = document.createElement("canvas");
          canvas.width = CARD_PREVIEW_CANVAS_SIZE;
          canvas.height = CARD_PREVIEW_CANVAS_SIZE;
          const renderer = createSceneRenderer(sp, canvas, true);
          previewStates[runtimeKey] = { canvas, ...renderer, sp };
          return previewStates[runtimeKey];
        }

        function renderPreviewImage(
          sp,
          runtimeKey,
          skeletonData,
          usesPremultipliedAlpha = false,
        ) {
          const preview = getPreviewState(sp, runtimeKey);
          const bounds = getSkeletonBounds(sp, skeletonData, runtimeKey);

          const skeleton = new sp.Skeleton(skeletonData);
          resetSkeletonToSetupPose(skeleton);
          applyFallbackSkinForRuntime(sp, skeletonData, skeleton, runtimeKey);

          if (
            Array.isArray(skeletonData.animations) &&
            skeletonData.animations.length > 0
          ) {
            const stateData = new sp.AnimationStateData(skeletonData);
            const state = new sp.AnimationState(stateData);
            state.setAnimation(0, skeletonData.animations[0].name, false);
            state.update(0.3);
            state.apply(skeleton);
          }

          updateSkeletonWorld(sp, skeleton);
          setupCamera(
            preview.sceneRenderer,
            bounds.cx,
            bounds.cy,
            bounds.w * cardPreviewCameraScale,
            bounds.h * cardPreviewCameraScale,
          );
          renderSkeleton(
            preview.sceneRenderer,
            preview.gl,
            skeleton,
            preview.canvas.width,
            preview.canvas.height,
            false,
            usesPremultipliedAlpha,
          );
          return preview.canvas.toDataURL("image/webp", CARD_STATIC_WEBP_QUALITY);
        }

        function renderCardPreviewFrames(
          sp,
          runtimeKey,
          skeletonData,
          usesPremultipliedAlpha = false,
        ) {
          const animations = Array.isArray(skeletonData.animations)
            ? skeletonData.animations
            : [];
          if (animations.length === 0) {
            return [
              renderPreviewImage(
                sp,
                runtimeKey,
                skeletonData,
                usesPremultipliedAlpha,
              ),
            ];
          }

          const preview = getPreviewState(sp, runtimeKey);
          const bounds = getSkeletonBounds(sp, skeletonData, runtimeKey);
          const skeleton = new sp.Skeleton(skeletonData);
          resetSkeletonToSetupPose(skeleton);
          applyFallbackSkinForRuntime(sp, skeletonData, skeleton, runtimeKey);

          const firstAnimation = animations[0];
          const duration = Math.max(firstAnimation?.duration || 0.001, 0.001);
          const frameDt = duration / CARD_PREVIEW_FRAME_COUNT;
          const stateData = new sp.AnimationStateData(skeletonData);
          const state = new sp.AnimationState(stateData);
          state.setAnimation(0, firstAnimation.name, true);

          const frames = [];
          for (let i = 0; i < CARD_PREVIEW_FRAME_COUNT; i += 1) {
            if (i > 0) state.update(frameDt);
            state.apply(skeleton);
            updateSkeletonWorld(sp, skeleton);

            setupCamera(
              preview.sceneRenderer,
              bounds.cx,
              bounds.cy,
              bounds.w * cardPreviewCameraScale,
              bounds.h * cardPreviewCameraScale,
            );
            renderSkeleton(
              preview.sceneRenderer,
              preview.gl,
              skeleton,
              preview.canvas.width,
              preview.canvas.height,
              false,
              usesPremultipliedAlpha,
            );
            frames.push(
              preview.canvas.toDataURL("image/webp", CARD_PREVIEW_WEBP_QUALITY),
            );
          }

          return frames.length > 0
            ? frames
            : [
                renderPreviewImage(
                  sp,
                  runtimeKey,
                  skeletonData,
                  usesPremultipliedAlpha,
                ),
              ];
        }

        function escapeNameForSearch(value) {
          return String(value || "").toLowerCase();
        }

        function createCard(
          entry,
          previewUrl,
          animNames,
          version,
          isBinary,
          index,
        ) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "card";
          card.style.animationDelay = `${Math.min(index * 0.03, 1)}s`;
          card.dataset.name = escapeNameForSearch(entry.name);
          card.dataset.previewIndex = String(index);

          const preview = document.createElement("div");
          preview.className = "card-preview";

          const image = document.createElement("img");
          image.src = previewUrl;
          image.alt = entry.name;

          const play = document.createElement("div");
          play.className = "card-play";

          const badge = document.createElement("div");
          badge.className = "card-badge";
          badge.textContent = `${animNames.length} anims`;

          preview.append(image, play, badge);

          const info = document.createElement("div");
          info.className = "card-info";

          const titleRow = document.createElement("div");
          titleRow.className = "card-title-row";

          const name = document.createElement("div");
          name.className = "card-name";
          name.textContent = entry.name;
          titleRow.appendChild(name);

          if (version) {
            const tag = document.createElement("span");
            tag.className = "card-version";
            tag.textContent = `${version}${isBinary ? " - SKEL" : ""}`;
            titleRow.appendChild(tag);
          }

          const meta = document.createElement("div");
          meta.className = "card-meta";

          const folder = document.createElement("span");
          folder.className = "card-folder";
          folder.textContent = `Folder: ${entry.folder}`;

          const animCount = document.createElement("span");
          animCount.className = "card-anims";
          animCount.textContent = `${animNames.length} anims`;

          meta.append(folder, animCount);
          info.append(titleRow, meta);
          card.append(preview, info);

          let frames = [previewUrl];
          let frameIndex = 0;
          let timer = null;
          let startDelayTimer = null;
          let isVisibleInViewport = false;

          const stopPreview = () => {
            if (startDelayTimer !== null) {
              clearTimeout(startDelayTimer);
              startDelayTimer = null;
            }
            if (timer !== null) {
              clearInterval(timer);
              activeCardPreviewIntervals.delete(timer);
              timer = null;
            }
            frameIndex = 0;
            image.src = frames[0] || previewUrl;
          };
          const startPreviewWithFrames = (nextFrames) => {
            if (!Array.isArray(nextFrames) || nextFrames.length <= 1) return;
            frames = nextFrames;
            if (timer !== null) return;
            timer = setInterval(() => {
              frameIndex = (frameIndex + 1) % frames.length;
              image.src = frames[frameIndex];
            }, CARD_PREVIEW_INTERVAL_MS);
            activeCardPreviewIntervals.add(timer);
          };
          const startPreview = async () => {
            if (!isVisibleInViewport) return;
            if (frames.length > 1) {
              startPreviewWithFrames(frames);
              return;
            }

            const generated = await getCardPreviewFramesByIndex(index);
            if (!isVisibleInViewport) return;
            startPreviewWithFrames(generated);
          };
          const scheduleStartPreview = () => {
            if (!isVisibleInViewport) return;
            if (startDelayTimer !== null || timer !== null) return;
            startDelayTimer = setTimeout(() => {
              startDelayTimer = null;
              startPreview();
            }, CARD_PREVIEW_START_DELAY_MS);
          };

          const controller = {
            card,
            stop: stopPreview,
            setStaticPreview(nextPreviewUrl) {
              if (typeof nextPreviewUrl !== "string" || !nextPreviewUrl) return;
              frames = [nextPreviewUrl];
              frameIndex = 0;
              image.src = nextPreviewUrl;
            },
            setViewportActive(isActive) {
              if (isVisibleInViewport === isActive) return;
              isVisibleInViewport = isActive;
              if (isVisibleInViewport) {
                scheduleStartPreview();
                return;
              }
              stopPreview();
            },
          };
          card.__cardPreviewController = controller;
          cardPreviewControllers.add(controller);
          ensureCardPreviewObserver().observe(card);
          scheduleCardPreviewVisibilitySync();

          card.addEventListener("click", () => openModal(index, animNames));
          return card;
        }

        function createErrorCard(entry, message, index) {
          const card = document.createElement("div");
          card.className = "card";
          card.style.animationDelay = `${Math.min(index * 0.03, 1)}s`;
          card.dataset.name = escapeNameForSearch(entry.name);

          const preview = document.createElement("div");
          preview.className = "card-preview";
          preview.style.flexDirection = "column";
          preview.style.color = "var(--accent-secondary)";

          const icon = document.createElement("div");
          icon.className = "error-icon";
          icon.textContent = "Error";

          const errorText = document.createElement("div");
          errorText.className = "error-text";
          errorText.textContent = message;

          preview.append(icon, errorText);

          const info = document.createElement("div");
          info.className = "card-info";

          const name = document.createElement("div");
          name.className = "card-name";
          name.textContent = entry.name;

          const meta = document.createElement("div");
          meta.className = "card-meta";

          const folder = document.createElement("span");
          folder.className = "card-folder";
          folder.textContent = `Folder: ${entry.folder}`;

          const errorBadge = document.createElement("span");
          errorBadge.className = "card-anims";
          errorBadge.style.color = "var(--accent-secondary)";
          errorBadge.textContent = "Error";

          meta.append(folder, errorBadge);
          info.append(name, meta);
          card.append(preview, info);
          return card;
        }

        function groupSpineEntries(files) {
          const folderMap = new Map();

          for (const file of files) {
            const relativePath = getFileRelativePath(file);
            const dir = relativePath.includes("/")
              ? relativePath.split("/").slice(0, -1).join("/")
              : "root";
            if (!folderMap.has(dir)) folderMap.set(dir, []);
            folderMap.get(dir).push(file);
          }

          const entries = [];

          for (const [dir, folderFiles] of folderMap.entries()) {
            const folderName = dir.split("/").pop() || dir;
            const pngFilesInFolder = folderFiles.filter((f) =>
              f.name.toLowerCase().endsWith(".png"),
            );

            const jsonFiles = folderFiles.filter(
              (file) =>
                file.name.toLowerCase().endsWith(".json") &&
                !file.name.toLowerCase().includes("settings"),
            );
            for (const jsonFile of jsonFiles) {
              const base = jsonFile.name.replace(/\.json$/i, "");
              const atlasFile = folderFiles.find(
                (file) =>
                  file.name.toLowerCase() === `${base.toLowerCase()}.atlas`,
              );
              const pngFile =
                folderFiles.find(
                  (file) =>
                    file.name.toLowerCase() === `${base.toLowerCase()}.png`,
                ) ||
                pngFilesInFolder[0] ||
                null;
              if (atlasFile && pngFilesInFolder.length > 0) {
                entries.push({
                  name: base,
                  folder: folderName,
                  jsonFile,
                  skelFile: null,
                  atlasFile,
                  pngFile,
                  pngFiles: pngFilesInFolder,
                });
              }
            }

            const skelFiles = folderFiles.filter((file) =>
              file.name.toLowerCase().endsWith(".skel"),
            );
            for (const skelFile of skelFiles) {
              const base = skelFile.name.replace(/\.skel$/i, "");
              const alreadyHasJson = entries.some(
                (entry) =>
                  entry.folder === folderName &&
                  entry.name.toLowerCase() === base.toLowerCase(),
              );
              if (alreadyHasJson) continue;

              const atlasFile = folderFiles.find(
                (file) =>
                  file.name.toLowerCase() === `${base.toLowerCase()}.atlas`,
              );
              const pngFile =
                folderFiles.find(
                  (file) =>
                    file.name.toLowerCase() === `${base.toLowerCase()}.png`,
                ) ||
                pngFilesInFolder[0] ||
                null;
              if (atlasFile && pngFilesInFolder.length > 0) {
                entries.push({
                  name: base,
                  folder: folderName,
                  jsonFile: null,
                  skelFile,
                  atlasFile,
                  pngFile,
                  pngFiles: pngFilesInFolder,
                });
              }
            }
          }

          return entries.sort((a, b) => a.name.localeCompare(b.name));
        }

        async function generateAll(entries) {
          stopAllCardPreviewAnimations();
          resetCardPreviewControllers();
          clearCardPreviewFrameCache();
          el.grid.replaceChildren();
          skeletonStore.clear();

          el.progressBar.style.display = "block";
          el.progressFill.style.width = "0%";
          setText(el.progressText, "Preparing previews...");

          for (let index = 0; index < entries.length; index += 1) {
            const entry = entries[index];
            const type = entry.skelFile ? "SKEL" : "JSON";
            const progress = Math.round(((index + 1) / entries.length) * 100);
            el.progressFill.style.width = `${progress}%`;
            setText(
              el.progressText,
              `Generating previews... ${index + 1}/${entries.length} (${entry.name}) [${type}]`,
            );

            try {
              const {
                skelData,
                atlasText,
                imageBundle,
                sp,
                isBinary,
                version,
                runtimeKey,
              } = await loadSpineFiles(entry);
              const {
                skeletonData,
                atlas,
                usesPremultipliedAlpha,
                glTexture,
                sp: resolvedSp,
                runtimeKey: resolvedRuntimeKey,
              } = await createSkeletonDataWithRuntimeFallback(
                skelData,
                atlasText,
                imageBundle,
                sp,
                runtimeKey,
                isBinary,
                version,
              );

              skeletonStore.set(index, {
                skeletonData,
                entry,
                skelData,
                atlasText,
                imageBundle,
                sp: resolvedSp,
                isBinary,
                version,
                runtimeKey: resolvedRuntimeKey,
                usesPremultipliedAlpha,
              });

              const animNames = Array.isArray(skeletonData.animations)
                ? skeletonData.animations.map((anim) => anim.name)
                : [];
              const previewUrl = renderPreviewImage(
                resolvedSp,
                resolvedRuntimeKey,
                skeletonData,
                usesPremultipliedAlpha,
              );
              el.grid.appendChild(
                createCard(
                  entry,
                  previewUrl,
                  animNames,
                  version,
                  isBinary,
                  index,
                ),
              );

              glTexture.dispose();
              atlas.dispose();
            } catch (error) {
              console.error(`Preview error for ${entry.name}:`, error);
              const message =
                error instanceof Error ? error.message : "Unknown error";
              el.grid.appendChild(createErrorCard(entry, message, index));
            }

            if (index % 2 === 0) await sleep(5);
          }

          el.progressBar.style.display = "none";
        }

        async function openModal(index, animNames) {
          const stored = skeletonStore.get(index);
          if (!stored) return;

          setText(
            el.modalTitle,
            stored.entry.name + (stored.version ? ` (v${stored.version})` : ""),
          );
          el.modalAnimSelect.replaceChildren();

          for (const name of animNames) {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            el.modalAnimSelect.appendChild(option);
          }

          stopModal();

          const previousCanvas = document.getElementById("modalCanvas");
          const wrap = previousCanvas.parentElement;
          const canvas = document.createElement("canvas");
          canvas.id = "modalCanvas";
          canvas.width = wrap.clientWidth || 800;
          canvas.height = wrap.clientHeight || 600;
          wrap.replaceChild(canvas, previousCanvas);
          el.modalCanvas = canvas;

          try {
            const { context, sceneRenderer, gl } = createSceneRenderer(
              stored.sp,
              canvas,
              false,
            );
            const {
              skeletonData,
              glTexture,
              atlas,
              usesPremultipliedAlpha,
            } = createSkeletonData(
              stored.skelData,
              stored.atlasText,
              stored.imageBundle,
              context,
              stored.sp,
              stored.isBinary,
            );
            const skeleton = new stored.sp.Skeleton(skeletonData);
            resetSkeletonToSetupPose(skeleton);
            applyFallbackSkinForRuntime(
              stored.sp,
              skeletonData,
              skeleton,
              stored.runtimeKey,
            );
            updateSkeletonWorld(stored.sp, skeleton);

            const animationStateData = new stored.sp.AnimationStateData(
              skeletonData,
            );
            animationStateData.defaultMix = 0.2;
            const animationState = new stored.sp.AnimationState(
              animationStateData,
            );

            const bounds = getSkeletonBounds(
              stored.sp,
              skeletonData,
              stored.runtimeKey,
            );
            el.modalAnimSelect.onchange = () => {
              if (!modalState?.running) return;
              setPreviewAnimation(el.modalAnimSelect.value);
            };
            el.previewFpsSelect.onchange = () => {
              if (!modalState?.running) return;
              modalState.previewFps = getSelectedPreviewFps();
              syncPreviewProgressUi();
            };

            const handleWheelZoom = (event) => {
              if (!modalState?.running) return;
              event.preventDefault();
              const factor = Math.exp(-event.deltaY * 0.0016);
              setModalZoom((modalState.zoom || MODAL_DEFAULT_ZOOM) * factor);
            };
            const handlePointerDown = (event) => {
              if (!modalState?.running) return;
              if (event.button !== 0 && event.button !== 1) return;
              event.preventDefault();
              modalState.isPanning = true;
              modalState.lastPointerX = event.clientX;
              modalState.lastPointerY = event.clientY;
              canvas.classList.add("is-panning");
              canvas.setPointerCapture?.(event.pointerId);
            };
            const handlePointerMove = (event) => {
              if (!modalState?.running || !modalState.isPanning) return;
              event.preventDefault();

              const dx = event.clientX - modalState.lastPointerX;
              const dy = event.clientY - modalState.lastPointerY;
              modalState.lastPointerX = event.clientX;
              modalState.lastPointerY = event.clientY;

              const width = canvas.clientWidth || canvas.width || 1;
              const height = canvas.clientHeight || canvas.height || 1;
              const zoom = modalState.zoom || MODAL_DEFAULT_ZOOM;
              const { viewW, viewH } = computeModalViewport(
                modalState.bounds,
                width,
                height,
                zoom,
              );
              modalState.panX -= (dx / width) * viewW;
              modalState.panY += (dy / height) * viewH;
            };
            const endPan = (event) => {
              if (!modalState) return;
              modalState.isPanning = false;
              canvas.classList.remove("is-panning");
              if (event && typeof event.pointerId === "number") {
                canvas.releasePointerCapture?.(event.pointerId);
              }
            };
            canvas.addEventListener("wheel", handleWheelZoom, { passive: false });
            canvas.addEventListener("pointerdown", handlePointerDown);
            canvas.addEventListener("pointermove", handlePointerMove);
            canvas.addEventListener("pointerup", endPan);
            canvas.addEventListener("pointercancel", endPan);

            let lastSimTime = Date.now();
            let lastRenderTime = 0;
            modalState = {
              running: true,
              context,
              glTexture,
              atlas,
              sp: stored.sp,
              skeleton,
              animState: animationState,
              bounds,
              sceneRenderer,
              gl,
              skeletonData,
              stored,
              usesPremultipliedAlpha,
              zoom: MODAL_DEFAULT_ZOOM,
              previewFps: getSelectedPreviewFps(),
              playing: true,
              isScrubbing: false,
              currentAnimationName: animNames[0] || "",
              animationDuration: 0.001,
              trackTime: 0,
              panX: 0,
              panY: 0,
              isPanning: false,
              lastPointerX: 0,
              lastPointerY: 0,
              canvas,
              handleWheelZoom,
              handlePointerDown,
              handlePointerMove,
              endPan,
            };
            syncModalZoomUi(MODAL_DEFAULT_ZOOM);
            if (modalState.currentAnimationName) {
              setPreviewAnimation(modalState.currentAnimationName);
            } else {
              syncPreviewProgressUi();
            }
            syncPlayPauseUi();

            const loop = () => {
              if (!modalState?.running) return;
              requestAnimationFrame(loop);

              const now = Date.now();
              const targetFps = modalState.previewFps || MODAL_DEFAULT_PREVIEW_FPS;
              const minFrameInterval = 1000 / targetFps;
              if (lastRenderTime > 0 && now - lastRenderTime < minFrameInterval) {
                return;
              }
              lastRenderTime = now;

              const dt = Math.min((now - lastSimTime) / 1000, 0.1);
              lastSimTime = now;

              if (modalState.playing) {
                animationState.update(dt);
                modalState.trackTime += dt;
                const duration = Math.max(0.001, modalState.animationDuration || 0.001);
                if (duration > 0) {
                  while (modalState.trackTime >= duration) {
                    modalState.trackTime -= duration;
                  }
                }
              }
              animationState.apply(skeleton);
              updateSkeletonWorld(stored.sp, skeleton);
              syncPreviewProgressUi();

              const width = wrap.clientWidth || 800;
              const height = wrap.clientHeight || 600;
              if (canvas.width !== width || canvas.height !== height) {
                canvas.width = width;
                canvas.height = height;
              }

              const zoom = modalState.zoom || MODAL_DEFAULT_ZOOM;
              const { viewW, viewH } = computeModalViewport(
                bounds,
                width,
                height,
                zoom,
              );
              setupCamera(
                sceneRenderer,
                bounds.cx + (modalState.panX || 0),
                bounds.cy + (modalState.panY || 0),
                viewW,
                viewH,
              );
              renderSkeleton(
                sceneRenderer,
                gl,
                skeleton,
                width,
                height,
                false,
                usesPremultipliedAlpha,
              );
            };

            loop();
            el.modal.classList.add("open");
            el.modal.setAttribute("aria-hidden", "false");
          } catch (error) {
            console.error("Modal open error:", error);
            alert(
              `Failed to open animation: ${error instanceof Error ? error.message : "Unknown error"}`,
            );
          }
        }

        function stopModal() {
          if (!modalState) return;
          modalState.running = false;
          try {
            modalState.canvas?.classList?.remove?.("is-panning");
            modalState.canvas?.removeEventListener?.("wheel", modalState.handleWheelZoom);
            modalState.canvas?.removeEventListener?.(
              "pointerdown",
              modalState.handlePointerDown,
            );
            modalState.canvas?.removeEventListener?.(
              "pointermove",
              modalState.handlePointerMove,
            );
            modalState.canvas?.removeEventListener?.("pointerup", modalState.endPan);
            modalState.canvas?.removeEventListener?.("pointercancel", modalState.endPan);
            modalState.glTexture?.dispose?.();
            modalState.atlas?.dispose?.();
            if (modalState.context) disposeRenderer(modalState.context);
          } catch (error) {
            console.warn("stopModal cleanup:", error);
          }
          modalState = null;
        }

        async function exportSpriteSheet() {
          if (!modalState?.running) {
            alert("Open an animation before exporting.");
            return;
          }

          el.btnExport.disabled = true;
          try {
            const frameSize = Number.parseInt(el.exportSize.value, 10) || 256;
            const fps = Number.parseInt(el.exportFps.value, 10) || 24;
            const cols = Number.parseInt(el.exportCols.value, 10) || 8;
            const dt = 1 / fps;
            const { sp, stored, bounds } = modalState;

            const exportCanvas = document.createElement("canvas");
            exportCanvas.width = frameSize;
            exportCanvas.height = frameSize;
            const {
              context: exCtx,
              sceneRenderer: exRenderer,
              gl: exGl,
            } = createSceneRenderer(sp, exportCanvas, true, true);

            const {
              skeletonData: exportSkeletonData,
              glTexture: exportTexture,
              atlas: exportAtlas,
              usesPremultipliedAlpha: exportUsesPremultipliedAlpha,
            } = createSkeletonData(
              stored.skelData,
              stored.atlasText,
              stored.imageBundle,
              exCtx,
              sp,
              stored.isBinary,
            );

            const skeleton = new sp.Skeleton(exportSkeletonData);
            resetSkeletonToSetupPose(skeleton);
            applyFallbackSkinForRuntime(
              sp,
              exportSkeletonData,
              skeleton,
              stored.runtimeKey,
            );
            updateSkeletonWorld(sp, skeleton);

            const animationStateData = new sp.AnimationStateData(
              exportSkeletonData,
            );
            const animationState = new sp.AnimationState(animationStateData);
            const animationName = el.modalAnimSelect.value;
            animationState.setAnimation(0, animationName, false);

            const animation = exportSkeletonData.animations.find(
              (item) => item.name === animationName,
            );
            const duration = animation ? animation.duration : 1;
            const totalFrames = Math.max(1, Math.ceil(duration * fps));
            const rows = Math.ceil(totalFrames / cols);
            setText(el.exportProgress, `0/${totalFrames} frames...`);

            const sheetCanvas = document.createElement("canvas");
            sheetCanvas.width = cols * frameSize;
            sheetCanvas.height = rows * frameSize;
            const sheetCtx = sheetCanvas.getContext("2d");

            const viewH = bounds.h * 1.3;
            const viewW = Math.max(viewH, bounds.w * 1.3);

            for (let i = 0; i < totalFrames; i += 1) {
              if (i === 0) {
                resetSkeletonToSetupPose(skeleton);
                animationState.setAnimation(0, animationName, false);
                animationState.update(0);
              } else {
                animationState.update(dt);
              }

              animationState.apply(skeleton);
              updateSkeletonWorld(sp, skeleton);

              setupCamera(exRenderer, bounds.cx, bounds.cy, viewW, viewH);
              renderSkeleton(
                exRenderer,
                exGl,
                skeleton,
                frameSize,
                frameSize,
                true,
                exportUsesPremultipliedAlpha,
              );

              const col = i % cols;
              const row = Math.floor(i / cols);
              sheetCtx.drawImage(
                exportCanvas,
                col * frameSize,
                row * frameSize,
              );

              setText(el.exportProgress, `${i + 1}/${totalFrames} frames...`);
              if (i % 4 === 0) await sleep(1);
            }

            exportTexture.dispose();
            exportAtlas.dispose();
            disposeRenderer(exCtx);

            const downloadLink = document.createElement("a");
            downloadLink.download = `${stored.entry.name}_${animationName}_${frameSize}x${frameSize}_${totalFrames}f.png`;
            downloadLink.href = sheetCanvas.toDataURL("image/png");
            downloadLink.click();

            setText(
              el.exportProgress,
              `Done: ${totalFrames} frames, ${sheetCanvas.width}x${sheetCanvas.height}px`,
            );
          } catch (error) {
            console.error("Export error:", error);
            setText(
              el.exportProgress,
              `Error: ${error instanceof Error ? error.message : "Unknown error"}`,
            );
          } finally {
            el.btnExport.disabled = false;
          }
        }

        function filterCards() {
          const query = escapeNameForSearch(el.searchInput.value.trim());
          let count = 0;

          el.grid.querySelectorAll(".card").forEach((card) => {
            const match =
              !query || String(card.dataset.name || "").includes(query);
            card.style.display = match ? "" : "none";
            if (match) count += 1;
          });

          setText(el.statusCount, count);
          reconnectCardPreviewObserver();
        }

        function clearAll() {
          stopModal();
          stopAllCardPreviewAnimations();
          resetCardPreviewControllers();
          dragOverlayDepth = 0;
          hideDropOverlay();
          clearCardPreviewFrameCache();
          skeletonStore.clear();
          allEntries = [];
          selectedFiles = [];
          el.statusBar.style.display = "none";
          el.btnClear.hidden = true;
          el.searchInput.value = "";
          el.searchInput.disabled = true;
          el.cardPreviewScaleSelect.value = "default";
          cardPreviewCameraScale = CARD_PREVIEW_CAMERA_SCALE_DEFAULT;
          el.folderInput.value = "";
          if (el.howto) el.howto.style.display = "";
          setText(el.exportProgress, "");
          syncModalZoomUi(MODAL_DEFAULT_ZOOM);
          showEmptyState();
        }

        async function ingestSelectedFiles(incomingFiles) {
          const files = Array.isArray(incomingFiles) ? incomingFiles : [];
          if (files.length === 0) return;

          const mergedFiles = mergeSelectedFiles(files);
          allEntries = groupSpineEntries(mergedFiles);
          if (allEntries.length === 0) {
            alert(
              "No valid Spine sets found. Required: (.json or .skel) + .atlas + .png with matching base names.",
            );
            return;
          }

          selectedFiles = mergedFiles;
          const folderSummary = getFolderSummary(mergedFiles);
          if (el.howto) el.howto.style.display = "none";
          el.statusBar.style.display = "flex";
          el.btnClear.hidden = false;
          el.searchInput.disabled = false;
          setText(el.statusCount, allEntries.length);
          setText(el.statusFolder, folderSummary);

          await generateAll(allEntries);
        }

        async function handleFolderChange(event) {
          const files = Array.from(event.target.files || []);
          if (files.length === 0) return;
          await ingestSelectedFiles(files);
          event.target.value = "";
        }

        async function handleDrop(event) {
          event.preventDefault();
          dragOverlayDepth = 0;
          hideDropOverlay();
          try {
            const droppedFiles = await collectDroppedFiles(event.dataTransfer);
            if (droppedFiles.length === 0) return;
            await ingestSelectedFiles(droppedFiles);
          } catch (error) {
            console.error("Drop import failed:", error);
            alert(
              `Drop upload failed: ${error instanceof Error ? error.message : "Unknown error"}`,
            );
          }
        }

        function handleDragEnter(event) {
          if (!isFileDrag(event)) return;
          event.preventDefault();
          dragOverlayDepth += 1;
          showDropOverlay();
        }

        function handleDragOver(event) {
          if (!isFileDrag(event)) return;
          event.preventDefault();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "copy";
          showDropOverlay();
        }

        function handleDragLeave(event) {
          if (!isFileDrag(event)) return;
          event.preventDefault();
          dragOverlayDepth = Math.max(0, dragOverlayDepth - 1);
          if (dragOverlayDepth === 0) hideDropOverlay();
        }

        function handleWindowBlur() {
          dragOverlayDepth = 0;
          hideDropOverlay();
        }

        el.pickFolderBtn.addEventListener("click", () =>
          el.folderInput.click(),
        );
        el.folderInput.addEventListener("change", handleFolderChange);
        window.addEventListener("dragenter", handleDragEnter);
        window.addEventListener("dragover", handleDragOver);
        window.addEventListener("dragleave", handleDragLeave);
        window.addEventListener("drop", handleDrop);
        window.addEventListener("blur", handleWindowBlur);
        el.searchInput.addEventListener("input", filterCards);
        el.cardPreviewScaleSelect.addEventListener("change", async () => {
          cardPreviewCameraScale = getSelectedCardPreviewScale();
          await refreshCardPreviewImages();
        });
        window.addEventListener("scroll", scheduleCardPreviewVisibilitySync, {
          passive: true,
        });
        window.addEventListener("resize", scheduleCardPreviewVisibilitySync, {
          passive: true,
        });
        el.grid.addEventListener("scroll", scheduleCardPreviewVisibilitySync, {
          passive: true,
        });
        el.btnClear.addEventListener("click", clearAll);
        el.playPauseBtn.addEventListener("click", () => {
          if (!modalState?.running) return;
          modalState.playing = !modalState.playing;
          syncPlayPauseUi();
        });
        el.previewProgressRange.addEventListener("pointerdown", () => {
          if (!modalState?.running) return;
          modalState.isScrubbing = true;
        });
        el.previewProgressRange.addEventListener("pointerup", () => {
          if (!modalState?.running) return;
          modalState.isScrubbing = false;
        });
        el.previewProgressRange.addEventListener("change", () => {
          if (!modalState?.running) return;
          modalState.isScrubbing = false;
        });
        el.previewProgressRange.addEventListener("input", () => {
          if (!modalState?.running) return;
          const fps = clamp(
            modalState.previewFps || MODAL_DEFAULT_PREVIEW_FPS,
            1,
            120,
          );
          const frameIndex = Math.max(
            0,
            Number.parseInt(el.previewProgressRange.value || "0", 10) || 0,
          );
          seekPreviewTo(frameIndex / fps);
        });
        el.zoomRange.addEventListener("input", () => {
          if (!modalState?.running) return;
          const nextZoom = Number(el.zoomRange.value) / 100;
          setModalZoom(nextZoom);
        });
        el.zoomOutBtn.addEventListener("click", () => {
          if (!modalState?.running) return;
          setModalZoom((modalState.zoom || MODAL_DEFAULT_ZOOM) - MODAL_ZOOM_STEP);
        });
        el.zoomInBtn.addEventListener("click", () => {
          if (!modalState?.running) return;
          setModalZoom((modalState.zoom || MODAL_DEFAULT_ZOOM) + MODAL_ZOOM_STEP);
        });
        el.zoomResetBtn.addEventListener("click", () => {
          if (!modalState?.running) return;
          modalState.panX = 0;
          modalState.panY = 0;
          setModalZoom(MODAL_DEFAULT_ZOOM);
        });
        el.modalClose.addEventListener("click", () => {
          el.modal.classList.remove("open");
          el.modal.setAttribute("aria-hidden", "true");
          stopModal();
        });
        el.modal.addEventListener("click", (event) => {
          if (event.target === el.modal) {
            el.modal.classList.remove("open");
            el.modal.setAttribute("aria-hidden", "true");
            stopModal();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && el.modal.classList.contains("open")) {
            el.modal.classList.remove("open");
            el.modal.setAttribute("aria-hidden", "true");
            stopModal();
            return;
          }
          if (!modalState?.running || !el.modal.classList.contains("open")) return;
          if (event.key === "+" || event.key === "=") {
            event.preventDefault();
            setModalZoom((modalState.zoom || MODAL_DEFAULT_ZOOM) + MODAL_ZOOM_STEP);
            return;
          }
          if (event.key === "-" || event.key === "_") {
            event.preventDefault();
            setModalZoom((modalState.zoom || MODAL_DEFAULT_ZOOM) - MODAL_ZOOM_STEP);
            return;
          }
          if (event.key === "0") {
            event.preventDefault();
            modalState.panX = 0;
            modalState.panY = 0;
            setModalZoom(MODAL_DEFAULT_ZOOM);
          }
        });
        el.btnExport.addEventListener("click", exportSpriteSheet);

        syncModalZoomUi(MODAL_DEFAULT_ZOOM);
        showEmptyState();
        window.clearAll = clearAll;
        window.exportSpriteSheet = exportSpriteSheet;
      })();
    </script>
  </body>
